<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Anas Aatar Wale</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #3A1F0A 0%, #5C3317 50%, #8B5E3C 100%); }
    .login-box {
      background: white; border-radius: 24px; padding: 44px 40px;
      width: min(420px, 92vw);
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn { from { opacity:0; transform:scale(0.88) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo-icon { font-size: 3rem; display: block; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .logo h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.6rem; color: #3A1F0A; margin-bottom: 4px; }
    .logo p { font-size: 0.8rem; color: #9CA3AF; letter-spacing: 1.5px; text-transform: uppercase; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    .input-wrap { position: relative; }
    input[type=text], input[type=password], input[type=email] {
      width: 100%; padding: 13px 16px; border: 1.5px solid #E5E7EB;
      border-radius: 12px; font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none; color: #1F2937;
      background: #FAFAFA;
    }
    input:focus { border-color: #5C3317; box-shadow: 0 0 0 3px rgba(92,51,23,0.1); background: white; }
    .eye-btn {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      border: none; background: none; cursor: pointer; font-size: 1rem; color: #9CA3AF;
    }
    .btn-login {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #5C3317, #8B5E3C);
      color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s; margin-top: 6px;
      box-shadow: 0 4px 16px rgba(92,51,23,0.35);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(92,51,23,0.45); }
    .btn-login:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }
    .error-msg {
      background: #FEF2F2; color: #DC2626; padding: 11px 15px;
      border-radius: 10px; font-size: 0.85rem; font-weight: 500;
      margin-bottom: 16px; display: none; border: 1px solid #FECACA;
    }
    .divider { text-align: center; margin: 20px 0 16px; color: #9CA3AF; font-size: 0.82rem; }
    .register-link { text-align: center; font-size: 0.88rem; color: #6B7280; }
    .register-link a { color: #5C3317; font-weight: 700; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <span class="logo-icon">🪷</span>
    <h1>Anas Aatar Wale</h1>
    <p>Premium Attar &amp; Perfumes</p>
  </div>

  <div class="error-msg" id="errMsg"></div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="identifier">Email or Username</label>
      <input type="text" id="identifier" name="identifier" placeholder="Enter email or username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="button" class="eye-btn" onclick="togglePwd()" tabindex="-1">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">Sign In →</button>
  </form>

  <div class="divider">Don't have an account?</div>
  <div class="register-link">
    <a href="{{ url_for('register') }}">Create Account</a>
  </div>
</div>

<script>
// FIX: Replace login page in browser history so back button doesn't return here
history.replaceState(null, '', window.location.href);

function togglePwd() {
  const el = document.getElementById('password');
  el.type = el.type === 'password' ? 'text' : 'password';
}

document.getElementById('loginForm').onsubmit = function(e) {
  e.preventDefault();
  const btn  = document.getElementById('loginBtn');
  const err  = document.getElementById('errMsg');
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in...';

  const fd   = new FormData(this);
  const next = new URLSearchParams(window.location.search).get('next') || '';

  fetch('/login' + (next ? '?next=' + encodeURIComponent(next) : ''), {
    method: 'POST', body: fd
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      btn.innerHTML = '✅ Welcome!';
      btn.style.background = 'linear-gradient(135deg,#1a6b3a,#2E7D52)';
      // Replace history so back button goes to home, not login
      history.replaceState(null, '', data.redirect);
      setTimeout(() => window.location.replace(data.redirect), 500);
    } else {
      btn.disabled  = false;
      btn.innerHTML = 'Sign In →';
      err.textContent   = data.message || 'Invalid credentials. Please try again.';
      err.style.display = 'block';
    }
  })
  .catch(() => {
    btn.disabled  = false;
    btn.innerHTML = 'Sign In →';
    err.textContent   = 'Connection error. Please try again.';
    err.style.display = 'block';
  });
};
</script>
</body>
</html>
