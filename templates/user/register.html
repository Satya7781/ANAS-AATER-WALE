{% extends "user/base.html" %}
{% block title %}Register - Anas Aatar Wale{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🪷</div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join Anas Aatar Wale today</p>
    </div>

    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" placeholder="Anas" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" placeholder="Khan">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input type="password" name="password" class="form-control" id="regPwd" placeholder="Min 6 characters" required minlength="6">
          <button type="button" onclick="togglePwd('regPwd',this)"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:1.1rem">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-dark btn-block" style="margin-top:8px">
        Create Account 🎉
      </button>
    </form>

    <div class="auth-divider">or</div>
    <p style="text-align:center;font-size:0.9rem;color:var(--text-light)">
      Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign In</a>
    </p>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁️' : '🙈';
}
</script>
{% endblock %}
