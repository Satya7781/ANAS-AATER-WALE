<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Anas Aatar Wale</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="admin-login-wrapper">
  <div class="admin-login-card">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#3A1F0A,#C4962A);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 14px">🪷</div>
      <h1 style="font-size:1.5rem;font-weight:700;color:#1F2937;margin-bottom:4px">Admin Login</h1>
      <p style="color:#6B7280;font-size:0.9rem">Anas Aatar Wale Control Panel</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div style="background:#fce4ec;color:#c62828;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:0.9rem">
      ⚠️ {{ message }}
    </div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="admin-form-group">
        <label class="admin-form-label">Username</label>
        <input type="text" name="username" class="admin-form-control" required placeholder="admin" autocomplete="username">
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label">Password</label>
        <input type="password" name="password" class="admin-form-control" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-admin btn-admin-primary" style="width:100%;justify-content:center;padding:12px;font-size:0.95rem;border-radius:10px;margin-top:8px">
        Login to Panel →
      </button>
    </form>

    <div style="margin-top:16px;text-align:center;padding:12px;background:#F9FAFB;border-radius:10px;font-size:0.8rem;color:#6B7280">
      💡 Default: <strong>admin</strong> / <strong>admin123</strong>
    </div>
  </div>
</div>
</body>
</html>
